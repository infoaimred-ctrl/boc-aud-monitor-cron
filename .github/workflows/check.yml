name: 检查中行澳元牌价并推送提醒

on:
  schedule:
    - cron: "*/5 * * * *"    # 每 5 分钟（GitHub 可能延迟几分钟）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 调用监控站的检查接口
        run: |
          curl -fsS -m 90 \
            -H "Authorization: Bearer ${{ secrets.CHECK_SECRET }}" \
            https://boc-aud-monitor.vercel.app/api/check
