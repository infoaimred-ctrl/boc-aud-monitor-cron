name: 检查中行澳元牌价并推送提醒

on:
  schedule:
    - cron: "2-59/5 * * * *"    # 每 5 分钟，避开整点高峰（GitHub 可能延迟）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 调用监控站的检查接口
        run: |
          # 中行偶尔限流会返回 502：重试两次，仍失败只记录、不判定为失败（避免发失败邮件）
          for i in 1 2 3; do
            if curl -fsS -m 90 \
              -H "Authorization: Bearer ${{ secrets.CHECK_SECRET }}" \
              https://boc-aud-monitor.vercel.app/api/check; then
              exit 0
            fi
            echo "第 $i 次失败，稍后重试"
            sleep 20
          done
          echo "::warning::本次未取到中行牌价，下次再试"
